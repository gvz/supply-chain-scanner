# Builds a .deb for each supported Debian and Ubuntu release.
#
# Each package is built *inside* that release's own container rather than
# cross-built on the runner: the binary links the host glibc, and a package
# built against Ubuntu 26.10's glibc will not install on Debian 12. Building
# where the package will run is the only way the dependency the control file
# claims is the dependency the package actually has.
name: Debian packages

on:
  # Release builds.
  push:
    tags: ["v*"]
  # Build on demand, for testing the pipeline or cutting an ad-hoc package.
  workflow_dispatch:
  # On pull requests, only when packaging itself changes — four container
  # builds on every documentation typo would be wasteful, but a change to the
  # packaging metadata that breaks the build should not reach main unnoticed.
  pull_request:
    paths:
      - Cargo.toml
      - .github/workflows/debian.yml

permissions:
  contents: read

concurrency:
  group: deb-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned, with the checksum published by static.rust-lang.org hardcoded
  # below rather than fetched alongside the binary: a server able to serve a
  # tampered binary is equally able to serve a matching checksum file.
  RUSTUP_VERSION: 1.29.3
  RUSTUP_INIT_SHA256: b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55
  CARGO_DEB_VERSION: 3.8.0

jobs:
  deb:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    timeout-minutes: 45
    strategy:
      # One distribution failing must not hide the state of the other three.
      fail-fast: false
      matrix:
        include:
          - image: debian:12
            id: debian12
          - image: debian:13
            id: debian13
          - image: ubuntu:26.04
            id: ubuntu26.04
          - image: ubuntu:26.10
            id: ubuntu26.10
    steps:
      # Must precede checkout: the bare images have no git, and the action
      # falls back to a slower tarball download without it. `dpkg-dev` carries
      # dpkg-shlibdeps, which is what resolves `depends = "$auto"` into this
      # release's actual glibc version.
      - name: Install build prerequisites
        run: |
          set -eux
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config dpkg-dev

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # The container runs as root over a directory owned by another uid, so
      # git refuses to operate on it until the path is marked safe.
      - name: Mark the checkout safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # No distribution rustc: Debian 12 ships 1.63 and rust-toolchain.toml
      # pins 1.88.0. `--default-toolchain none` leaves the choice to that
      # file, so the toolchain can only ever come from the repository.
      - name: Install rustup ${{ env.RUSTUP_VERSION }} (checksum-verified)
        run: |
          set -eux
          url="https://static.rust-lang.org/rustup/archive/${RUSTUP_VERSION}/x86_64-unknown-linux-gnu/rustup-init"
          curl -fsSL --proto '=https' --tlsv1.2 -o /tmp/rustup-init "$url"
          echo "${RUSTUP_INIT_SHA256}  /tmp/rustup-init" | sha256sum --check --strict
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Show the toolchain rust-toolchain.toml selected
        run: |
          rustup show active-toolchain
          cargo --version
          rustc --version

      - name: Restore cargo caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin/cargo-deb
            target
          # Keyed per image: these artifacts are glibc-specific and must not
          # be shared between distributions.
          key: deb-${{ matrix.id }}-cargo${{ env.CARGO_DEB_VERSION }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            deb-${{ matrix.id }}-cargo${{ env.CARGO_DEB_VERSION }}-

      - name: Install cargo-deb ${{ env.CARGO_DEB_VERSION }}
        run: |
          set -eux
          if ! command -v cargo-deb >/dev/null; then
            cargo install cargo-deb --locked --version "${CARGO_DEB_VERSION}"
          fi

      # `--` passes the rest to cargo build: `--locked` means a build that
      # would rewrite Cargo.lock fails instead of quietly resolving something
      # new, which is what keeps the deliberate `uuid = "=1.11.0"` pin honest.
      #
      # The revision carries the distribution id, so the four packages are
      # distinguishable and a newer release always sorts above an older one
      # for the same upstream version.
      - name: Build the package
        run: cargo deb --deb-revision "1~${{ matrix.id }}" -- --locked

      # Everything below is verification, not packaging: a .deb that builds
      # but does not install, or installs a binary that cannot run, is worse
      # than a failed build because it ships.
      - name: Inspect the package
        run: |
          set -eux
          deb=$(ls target/debian/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Install it and run the binary
        run: |
          set -eux
          deb=$(ls target/debian/*.deb)
          apt-get install -y --no-install-recommends "$PWD/$deb"
          command -v supply-chain-scanner
          supply-chain-scanner --version
          supply-chain-scanner --help
          test -f /usr/share/doc/supply-chain-scanner/copyright
          test -f /usr/share/doc/supply-chain-scanner/examples/config.example.toml

      - name: Confirm the package refuses to run without a config
        run: |
          set -eux
          # The server requires --config; exiting non-zero with a message is
          # the documented behaviour, so a zero exit here would mean the
          # packaged binary is not the one this repository builds.
          if supply-chain-scanner; then
            echo "expected a non-zero exit without --config" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-scanner-${{ matrix.id }}
          path: target/debian/*.deb
          if-no-files-found: error
