[package]
name = "supply_chain_scanner"
version = "0.1.0"
edition = "2021"

[lib]
name = "supply_chain_scanner"
path = "src/lib.rs"

[[bin]]
name = "supply-chain-scanner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
arc-swap = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
humantime-serde = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rand = "0.10.3"
# Transitive dependency of r2d2_sqlite. Pinned because uuid 1.28 requires
# rustc 1.89, but this repo pins rustc 1.88.0 via rust-toolchain.toml; an
# unconstrained `cargo update` would otherwise silently re-bump uuid and
# break the build. Remove this pin once the toolchain is bumped past 1.89.
uuid = "=1.11.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
bytes = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"
cvss = "3"
serde_json = "1"
tempfile = "3"
pep440_rs = "0.7"
semver = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "tower-log"] }
hyper = { version = "1", features = ["http1"] }
async-trait = "0.1"

[dev-dependencies]
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
wiremock = "0.6"

# The zip-bomb test in `tests/plugin.rs` has to push more than the
# unpacker's 512 MiB limit through deflate to build its fixture, and the
# dev profile's opt-level 0 makes the compression crates roughly 20x
# slower than the release build the proxy actually ships. Optimizing only
# these three keeps `cargo test` quick without affecting the crate's own
# debuggability.
[profile.dev.package.flate2]
opt-level = 2

[profile.dev.package.zlib-rs]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2
