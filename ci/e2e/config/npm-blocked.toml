bind = "0.0.0.0:8080"
db_path = "/var/lib/supply-chain-scanner/scanner.db"
cache_dir = "/var/lib/supply-chain-scanner/cache"
upstream_url = "https://registry.npmjs.org"
public_url = "http://proxy:8080"
scan_budget = "12s"
cache_ttl = "24h"
advisory_sync_interval = "24h"
advisory_source_url = "http://127.0.0.1:9000/osv/all.zip"

[audit]
path = "/var/log/scanner/audit.jsonl"

[cve]
min_severity = 7.0
require_fix_available = false
unknown_severity = "allow"

[npm_registry]
# Nothing published in the last century: every version is too new, so the
# cascade can forward none of them and the listing comes back empty.
min_release_age_days = 36500
upstream_registry_url = "https://registry.npmjs.org"

[ai_review]
enabled = true
base_url = "http://127.0.0.1:9000/v1/"
model = "stub"
timeout = "10s"
coverage_threshold = 0.0
block_on = "malicious"
block_opaque_executables = false
