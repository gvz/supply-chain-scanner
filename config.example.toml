# Example configuration for supply-chain-scanner.
#
# Copy this file, edit it for your org, and point the binary at it with
# `--config`. Every field below is required unless noted otherwise.

# Address the proxy listens on.
bind = "127.0.0.1:8080"

# Where the SQLite verdict/advisory/cache database lives.
db_path = "data/scanner.db"

# Where cached artifact files are stored on disk.
cache_dir = "data/cache"

# The real PyPI the proxy fetches from.
upstream_url = "https://pypi.org"

# The URL developers' tools see this proxy as (used to build absolute links,
# e.g. in /why/<id> pages).
public_url = "http://localhost:8080"

# How long a first-time scan is allowed to run before the request returns a
# retryable "scan in progress" response instead of hanging. Must stay at or
# below 14s: pip's own default request timeout is 15s, so anything higher
# always loses that race. Accepts humantime strings such as "12s".
scan_budget = "12s"

# How long a passing artifact is kept on disk before it must be refetched.
# The TTL is sliding: every request resets it.
cache_ttl = "24h"

# How often the local OSV advisory mirror is refreshed.
advisory_sync_interval = "1h"

# Where the OSV advisory mirror is synced from. Optional — defaults to the
# value shown here (the public OSV PyPI feed) if omitted.
advisory_source_url = "https://osv-vulnerabilities.storage.googleapis.com/PyPI/all.zip"

[cve]
# Advisories scoring at or above this severity (CVSS-style, 0.0-10.0) block
# the package.
min_severity = 7.0

# If true, only advisories that also list a fixed version block the
# package; advisories with no known fix are allowed through.
require_fix_available = false

# How to treat advisories with missing or unparseable severity: "allow" lets
# them through, "block" refuses the package. Optional — defaults to
# "allow": treating unknown severity as blocking would refuse a large share
# of ordinary packages on day one.
unknown_severity = "allow"

# The youngest a published file may be and still be forwarded, in days
# since it was uploaded. Optional — omit it (or leave it unset) to turn
# this gate off. Best-effort, not a security gate like [cve] or AI review:
# when upstream does not report a file's publish time at all, the gate does
# not block — it logs and lets the rest of the scan proceed. A
# [cargo_registry] deployment sets its own, independent
# cargo_registry.min_release_age_days instead, so PyPI and cargo can run
# different thresholds (or one on and the other off).
# min_release_age_days = 7

# Specific package+version entries the org has reviewed and decided to
# permit regardless of stored verdict. A hash mismatch still refuses even
# an allowlisted entry. Optional — defaults to empty.
[[allowlist]]
package = "example-package"
version = "1.2.3"

# Org-supplied check binaries, run in order against every unpacked,
# unverdicted artifact. Exit code 0 means clean, non-zero means blocked.
# Optional — defaults to empty.
[[plugins]]
name = "yara-malware"
binary = "/opt/scanner/plugins/yara-malware"
timeout = "5s"

# Timeouts for downloading an artifact's bytes. Optional — defaults shown.
#
# Deliberately NOT a total per-request deadline: a total deadline on a
# download path is a cap on artifact size disguised as a cap on time (at
# 10s total, a 900 MB `torch` wheel would need a sustained 90 MB/s, so
# every large ML/CUDA wheel becomes permanently unservable). Instead:
[download]
# Abandon a transfer that goes this long without receiving a single byte.
# Resets on every successful read, so an honest slow download of a large
# artifact is never penalized for being large, while a dead connection
# still fails in seconds.
stall_timeout = "30s"

# Absolute backstop against a connection that dribbles a byte at a time
# forever, which stall detection alone cannot catch. Generous on purpose:
# this allows PyPI's largest (~1 GB) artifacts at a sustained 600 KB/s.
# A download that outlives `scan_budget` is normal — the request returns a
# retryable "scan in progress" while the detached scan finishes and stores
# its verdict.
max_duration = "30m"

# Hard cap, in bytes, on one artifact's downloaded size. Optional — defaults
# to 2147483648 (2 GiB). Checked against `Content-Length` up front when
# upstream supplies one, and against the running total of bytes actually
# received either way (so a response with no declared length, or one that
# understates it, is still caught). 2 GiB clears every real artifact this
# proxy has been tested against with room to spare — including a 906 MB
# `torch` wheel — while still bounding a single download to a survivable
# write, which matters because the download path writes into a temp
# directory that is typically tmpfs-backed (RAM) on Linux.
max_artifact_bytes = 2147483648

# Everything in [download] above, including max_artifact_bytes, is
# restart-only: these values are baked into the upstream HTTP clients at
# startup and cannot be changed by a SIGHUP reload. A reload that changes
# any of them is rejected in full, naming the field, and the previously
# running configuration keeps running.

# How many full scans (download + unpack + plugins) may run at once.
# Optional — omit it (or leave it unset) to size it automatically from the
# host's available parallelism, at 2 per CPU, clamped to 2..=16, which is
# the right call for most deployments. Each full scan holds a
# `spawn_blocking` slot for the whole of a plugin's timeout, plus three
# further OS threads for the sandbox run, and that same blocking pool also
# serves every SQLite call this crate makes — so an unbounded number of
# concurrent scans can starve ordinary verdict lookups under a parallel
# dependency resolution or a pip retry storm. A request that cannot get a
# slot returns a retryable "scan in progress" (HTTP 429) while its scan
# waits its turn; it is never refused outright.
#
# Restart-only: this is baked into the scanner's internal semaphore once
# at startup and cannot be changed by a SIGHUP reload.
# max_concurrent_scans = 8
